# CI for this copy of Express: the reusable pipeline runs the real Express test suite and lint, pinned to a commit.
name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    uses: docaohieu2808/reusable-workflows/.github/workflows/auto-pipeline.yml@879b76e3e519725f0bfaea657865182b72addf4f # v2.0.1
